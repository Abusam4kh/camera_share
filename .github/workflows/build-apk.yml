name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      # Install Gradle 8.14.0 directly on GitHub Actions.
      # This is needed because the current project does not contain
      # the Gradle Wrapper files.
      - name: Setup Gradle 8.14.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.0"
          validate-wrappers: false

      # Create the missing Gradle Wrapper files inside android/.
      - name: Generate Gradle Wrapper
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "Generating Gradle Wrapper..."

          gradle wrapper \
            --gradle-version 8.14.0 \
            --distribution-type bin

          chmod +x gradlew

          echo "Gradle Wrapper generated successfully."

          echo "Checking wrapper files..."
          ls -la
          ls -la gradle/wrapper

          echo "Checking Gradle version..."
          ./gradlew --version

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze

      # Build the release APK.
      # The generated wrapper is now available and points to Gradle 8.14.0.
      - name: Build Release APK
        run: flutter build apk --release

      # Copy the APK to a simple predictable location.
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p build/release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/release/app-release.apk

          echo "APK created successfully:"
          ls -lh build/release/app-release.apk

      # Upload app-release.apk as a GitHub Actions artifact.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: camera-share-apk
          path: build/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
