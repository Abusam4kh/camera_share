name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Setup Gradle 8.14.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.1"
          validate-wrappers: false

      # Create the Flutter local.properties file required by
      # android/settings.gradle.kts.
      - name: Create Flutter local.properties
        shell: bash
        run: |
          set -e

          mkdir -p android

          cat > android/local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          flutter.sdk=${FLUTTER_ROOT}
          EOF

          echo "android/local.properties:"
          cat android/local.properties

      # Flutter 3.47 requires Android Gradle Plugin 8.11.1 or newer.
      # The existing project uses AGP 8.7.3, so update it automatically.
      - name: Update Android Gradle Plugin
        shell: bash
        run: |
          set -e

          echo "Updating Android Gradle Plugin to 8.11.1..."

          if [ -f android/settings.gradle.kts ]; then
            sed -i \
              -E 's/(com\.android\.(application|library)[[:space:]]+version[[:space:]]+["'\'']?)8\.[0-9]+\.[0-9]+/\18.11.1/g' \
              android/settings.gradle.kts
          fi

          if [ -f android/settings.gradle ]; then
            sed -i \
              -E 's/(com\.android\.(application|library)[[:space:]]+version[[:space:]]+["'\'']?)8\.[0-9]+\.[0-9]+/\18.11.1/g' \
              android/settings.gradle
          fi

          if [ -f android/build.gradle.kts ]; then
            sed -i \
              -E 's/(com\.android\.tools\.build:gradle:)[0-9]+\.[0-9]+\.[0-9]+/\18.11.1/g' \
              android/build.gradle.kts
          fi

          if [ -f android/build.gradle ]; then
            sed -i \
              -E 's/(com\.android\.tools\.build:gradle:)[0-9]+\.[0-9]+\.[0-9]+/\18.11.1/g' \
              android/build.gradle
          fi

          echo "Current Android Gradle Plugin references:"
          grep -R \
            -E 'com\.android\.(application|library)|com\.android\.tools\.build:gradle' \
            android \
            --include='settings.gradle' \
            --include='settings.gradle.kts' \
            --include='build.gradle' \
            --include='build.gradle.kts' \
            || true

      # Generate the missing Gradle Wrapper.
      - name: Generate Gradle Wrapper
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "Generating Gradle Wrapper using Gradle 8.14.1..."

          gradle wrapper \
            --gradle-version 8.14.1 \
            --distribution-type bin

          chmod +x gradlew

          echo "Wrapper files:"
          ls -la
          ls -la gradle/wrapper

          echo "Checking Gradle Wrapper:"
          ./gradlew --version

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p build/release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/release/app-release.apk

          echo "APK successfully created:"
          ls -lh build/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: camera-share-apk
          path: build/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
