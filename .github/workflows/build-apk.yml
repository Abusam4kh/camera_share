name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Setup Gradle 8.14.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.1"
          validate-wrappers: false

      # Create the Flutter local.properties file.
      - name: Create local.properties
        shell: bash
        run: |
          set -e

          cat > android/local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          flutter.sdk=${FLUTTER_ROOT}
          EOF

          echo "Created android/local.properties:"
          cat android/local.properties

      # Update AGP and Kotlin versions in the Kotlin DSL files.
      - name: Update Android build versions
        shell: bash
        run: |
          set -e

          echo "Updating Android Gradle Plugin to 8.11.1..."
          echo "Updating Kotlin Gradle Plugin to 2.2.20..."

          # settings.gradle.kts
          if [ -f android/settings.gradle.kts ]; then

            sed -i \
              's/id("com\.android\.application") version "[^"]*"/id("com.android.application") version "8.11.1"/' \
              android/settings.gradle.kts

            sed -i \
              's/id("org\.jetbrains\.kotlin\.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.2.20"/' \
              android/settings.gradle.kts

          fi

          # settings.gradle, if present
          if [ -f android/settings.gradle ]; then

            sed -i \
              's/id[[:space:]]*["'\'']com\.android\.application["'\''][[:space:]]*version[[:space:]]*["'\''][^"'\'']*["'\'']/id "com.android.application" version "8.11.1"/' \
              android/settings.gradle

            sed -i \
              's/id[[:space:]]*["'\'']org\.jetbrains\.kotlin\.android["'\''][[:space:]]*version[[:space:]]*["'\''][^"'\'']*["'\'']/id "org.jetbrains.kotlin.android" version "2.2.20"/' \
              android/settings.gradle

          fi

          # build.gradle.kts
          if [ -f android/build.gradle.kts ]; then

            sed -i \
              's/id("com\.android\.application") version "[^"]*" apply false/id("com.android.application") version "8.11.1" apply false/' \
              android/build.gradle.kts

            sed -i \
              's/id("org\.jetbrains\.kotlin\.android") version "[^"]*" apply false/id("org.jetbrains.kotlin.android") version "2.2.20" apply false/' \
              android/build.gradle.kts

          fi

          # build.gradle, if present
          if [ -f android/build.gradle ]; then

            sed -i \
              -E 's/(com\.android\.tools\.build:gradle:)[0-9]+\.[0-9]+\.[0-9]+/\18.11.1/g' \
              android/build.gradle

            sed -i \
              -E 's/(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)[0-9]+\.[0-9]+\.[0-9]+/\12.2.20/g' \
              android/build.gradle

          fi

          echo ""
          echo "===== settings.gradle.kts ====="
          if [ -f android/settings.gradle.kts ]; then
            cat android/settings.gradle.kts
          fi

          echo ""
          echo "===== build.gradle.kts ====="
          if [ -f android/build.gradle.kts ]; then
            cat android/build.gradle.kts
          fi

      # Verify that the versions were actually changed.
      - name: Verify Android versions
        shell: bash
        run: |
          set -e

          echo "Checking Android Gradle Plugin..."

          if ! grep -R 'com.android.application.*8.11.1' \
            android/settings.gradle.kts \
            android/build.gradle.kts 2>/dev/null; then
            echo "ERROR: AGP 8.11.1 was not found."
            exit 1
          fi

          echo "Checking Kotlin..."

          if ! grep -R 'org.jetbrains.kotlin.android.*2.2.20' \
            android/settings.gradle.kts \
            android/build.gradle.kts 2>/dev/null; then
            echo "ERROR: Kotlin 2.2.20 was not found."
            exit 1
          fi

          echo "Android versions verified successfully."

      # Generate the missing Gradle Wrapper.
      - name: Generate Gradle Wrapper
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "Generating Gradle Wrapper using Gradle 8.14.1..."

          gradle wrapper \
            --gradle-version 8.14.1 \
            --distribution-type bin

          chmod +x gradlew

          echo ""
          echo "===== Wrapper files ====="
          ls -la
          ls -la gradle/wrapper

          echo ""
          echo "===== Gradle version ====="
          ./gradlew --version

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p build/release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/release/app-release.apk

          echo ""
          echo "===== APK CREATED ====="
          ls -lh build/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: camera-share-apk
          path: build/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
