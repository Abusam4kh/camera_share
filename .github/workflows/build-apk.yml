name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.1"
          validate-wrappers: false

      - name: Create local.properties
        shell: bash
        run: |
          set -e

          cat > android/local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          flutter.sdk=${FLUTTER_ROOT}
          EOF

          echo "===== local.properties ====="
          cat android/local.properties

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          echo ""
          echo "Available API 37 packages:"
          "$SDKMANAGER" --list | grep "platforms;android-37" || true

          echo ""
          echo "Installing required packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

          echo ""
          echo "===== Android platforms ====="
          find "$ANDROID_HOME/platforms" -maxdepth 1 -type d -print

          echo ""
          echo "===== NDK ====="
          find "$ANDROID_HOME/ndk" -maxdepth 1 -type d -print

      - name: Update Android build versions
        shell: bash
        run: |
          set -e

          echo "Updating AGP to 8.11.1"
          echo "Updating Kotlin to 2.2.20"

          if [ -f android/settings.gradle.kts ]; then

            sed -i \
              -E 's/(id\("com\.android\.application"\)[[:space:]]+version[[:space:]]+")([0-9]+\.[0-9]+\.[0-9]+)(")/\18.11.1\3/g' \
              android/settings.gradle.kts

            sed -i \
              -E 's/(id\("org\.jetbrains\.kotlin\.android"\)[[:space:]]+version[[:space:]]+")([0-9]+\.[0-9]+\.[0-9]+)(")/\12.2.20\3/g' \
              android/settings.gradle.kts

          fi

          if [ -f android/build.gradle.kts ]; then

            sed -i \
              -E 's/(id\("com\.android\.application"\)[[:space:]]+version[[:space:]]+")([0-9]+\.[0-9]+\.[0-9]+)(")/\18.11.1\3/g' \
              android/build.gradle.kts

            sed -i \
              -E 's/(id\("org\.jetbrains\.kotlin\.android"\)[[:space:]]+version[[:space:]]+")([0-9]+\.[0-9]+\.[0-9]+)(")/\12.2.20\3/g' \
              android/build.gradle.kts

          fi

          if [ -f android/build.gradle ]; then

            sed -i \
              -E 's/(com\.android\.tools\.build:gradle:)[0-9]+\.[0-9]+\.[0-9]+/\18.11.1/g' \
              android/build.gradle || true

            sed -i \
              -E 's/(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)[0-9]+\.[0-9]+\.[0-9]+/\12.2.20/g' \
              android/build.gradle || true

          fi

          echo ""
          echo "===== Android plugin versions ====="

          grep -R \
            -E 'com\.android\.application|org\.jetbrains\.kotlin\.android' \
            android \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            2>/dev/null || true

      - name: Configure compileSdk and NDK
        shell: bash
        run: |
          set -e

          FILE="android/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found."
            exit 1
          fi

          sed -i \
            's/compileSdk = flutter\.compileSdkVersion/compileSdk = 37/' \
            "$FILE"

          if grep -q "ndkVersion" "$FILE"; then
            sed -i \
              's/ndkVersion = .*/ndkVersion = "28.2.13676358"/' \
              "$FILE"
          else
            sed -i \
              '/compileSdk = 37/a\
              ndkVersion = "28.2.13676358"' \
              "$FILE"
          fi

          echo ""
          echo "===== app/build.gradle.kts ====="
          cat "$FILE"

      - name: Create launcher icon
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/res/drawable

          cat > android/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#1976D2"
                  android:pathData="M0,0h108v108h-108z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,24
                  A30,30 0,1 0,54 84
                  A30,30 0,1 0,54 24" />

              <path
                  android:fillColor="#1976D2"
                  android:pathData="M54,34
                  A20,20 0,1 0,54 74
                  A20,20 0,1 0,54 34" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,43
                  A11,11 0,1 0,54 65
                  A11,11 0,1 0,54 43" />

          </vector>
          EOF

          sed -i \
            's#@mipmap/ic_launcher#@drawable/ic_launcher#' \
            android/app/src/main/AndroidManifest.xml

          echo "Launcher icon ready."

      - name: Verify Android configuration
        shell: bash
        run: |
          set -e

          echo "===== compileSdk / NDK ====="

          grep -E \
            "compileSdk|ndkVersion" \
            android/app/build.gradle.kts

          echo ""
          echo "===== Android API 37 ====="

          if [ -f "$ANDROID_HOME/platforms/android-37.0/android.jar" ]; then
            echo "Android API 37.0 is installed."
          elif [ -f "$ANDROID_HOME/platforms/android-37/android.jar" ]; then
            echo "Android API 37 is installed."
          else
            echo "ERROR: Android API 37 android.jar not found."
            find "$ANDROID_HOME/platforms" -maxdepth 2 -name android.jar -print
            exit 1
          fi

          echo ""
          echo "===== NDK ====="

          test -d "$ANDROID_HOME/ndk/28.2.13676358"

          echo "NDK 28.2.13676358 is installed."

      - name: Generate Gradle Wrapper
        working-directory: android
        shell: bash
        run: |
          set -e

          gradle wrapper \
            --gradle-version 8.14.1 \
            --distribution-type bin

          chmod +x gradlew

          echo ""
          echo "===== Gradle version ====="

          ./gradlew --version

      - name: Flutter Pub Get
        run: |
          set -e
          flutter pub get

      - name: Flutter Analyze
        run: |
          set -e
          flutter analyze

      - name: Build Release APK
        run: |
          set -e

          flutter build apk \
            --release \
            --verbose

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find build \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null || true

          APK="$(find build -type f -name "app-release.apk" | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            echo ""
            echo "Gradle files:"
            find android/app/build -type f 2>/dev/null | tail -n 50 || true
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          mkdir -p build/release

          cp "$APK" \
            build/release/app-release.apk

          echo ""
          echo "Final APK:"
          ls -lh build/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: camera-share-apk
          path: build/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
