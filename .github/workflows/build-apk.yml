name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Setup Gradle 8.14.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.1"
          validate-wrappers: false

      - name: Create local.properties
        shell: bash
        run: |
          set -e

          cat > android/local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          flutter.sdk=${FLUTTER_ROOT}
          EOF

          echo "===== android/local.properties ====="
          cat android/local.properties

      - name: Install Android SDK 37 and NDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --list | grep -E "platforms;android-37|ndk;28.2.13676358" || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

          echo ""
          echo "===== Installed Android platforms ====="
          ls -la "$ANDROID_HOME/platforms"

          echo ""
          echo "===== Installed NDK ====="
          ls -la "$ANDROID_HOME/ndk"

          # GitHub Ubuntu images may install Android API 37
          # under the directory android-37.0.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            rm -rf "$ANDROID_HOME/platforms/android-37"
            ln -s \
              "$ANDROID_HOME/platforms/android-37.0" \
              "$ANDROID_HOME/platforms/android-37"
          fi

          echo ""
          echo "===== Android 37 ====="
          ls -la "$ANDROID_HOME/platforms" | grep "android-37" || true

          echo ""
          echo "Android SDK and NDK installed successfully."

      - name: Update Android build versions
        shell: bash
        run: |
          set -e

          echo "Updating Android Gradle Plugin to 8.11.1..."
          echo "Updating Kotlin to 2.2.20..."

          # ---------------------------------------------------------
          # settings.gradle.kts
          # ---------------------------------------------------------
          if [ -f android/settings.gradle.kts ]; then

            sed -i \
              -E 's/(id\("com\.android\.application"\)[[:space:]]+version[[:space:]]+")([0-9]+\.[0-9]+\.[0-9]+)(")/\18.11.1\3/g' \
              android/settings.gradle.kts

            sed -i \
              -E 's/(id\("org\.jetbrains\.kotlin\.android"\)[[:space:]]+version[[:space:]]+")([0-9]+\.[0-9]+\.[0-9]+)(")/\12.2.20\3/g' \
              android/settings.gradle.kts

          fi

          # ---------------------------------------------------------
          # build.gradle.kts
          # ---------------------------------------------------------
          if [ -f android/build.gradle.kts ]; then

            sed -i \
              -E 's/(id\("com\.android\.application"\)[[:space:]]+version[[:space:]]+")([0-9]+\.[0-9]+\.[0-9]+)(")/\18.11.1\3/g' \
              android/build.gradle.kts

            sed -i \
              -E 's/(id\("org\.jetbrains\.kotlin\.android"\)[[:space:]]+version[[:space:]]+")([0-9]+\.[0-9]+\.[0-9]+)(")/\12.2.20\3/g' \
              android/build.gradle.kts

          fi

          # ---------------------------------------------------------
          # build.gradle
          # ---------------------------------------------------------
          if [ -f android/build.gradle ]; then

            sed -i \
              -E 's/(com\.android\.tools\.build:gradle:)[0-9]+\.[0-9]+\.[0-9]+/\18.11.1/g' \
              android/build.gradle || true

            sed -i \
              -E 's/(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)[0-9]+\.[0-9]+\.[0-9]+/\12.2.20/g' \
              android/build.gradle || true

          fi

          echo ""
          echo "========================================"
          echo "FINAL ANDROID BUILD VERSIONS"
          echo "========================================"

          echo ""
          echo "--- settings.gradle.kts ---"
          if [ -f android/settings.gradle.kts ]; then
            grep -nE \
              'com.android.application|org.jetbrains.kotlin.android' \
              android/settings.gradle.kts || true
          fi

          echo ""
          echo "--- build.gradle.kts ---"
          if [ -f android/build.gradle.kts ]; then
            grep -nE \
              'com.android.application|org.jetbrains.kotlin.android' \
              android/build.gradle.kts || true
          fi

          echo ""
          echo "--- build.gradle ---"
          if [ -f android/build.gradle ]; then
            grep -nE \
              'com.android.tools.build:gradle|kotlin-gradle-plugin' \
              android/build.gradle || true
          fi

          echo ""
          echo "Checking for old AGP 8.7.3..."

          if grep -R \
            'com.android.application.*8.7.3' \
            android \
            --include='*.gradle' \
            --include='*.gradle.kts' \
            2>/dev/null; then

            echo "ERROR: AGP 8.7.3 still exists."
            exit 1
          fi

          echo "Old AGP 8.7.3 was removed successfully."

      - name: Configure compileSdk and NDK
        shell: bash
        run: |
          set -e

          FILE="android/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found."
            exit 1
          fi

          # Set compileSdk to Android API 37.
          sed -i \
            's/compileSdk = flutter\.compileSdkVersion/compileSdk = 37/' \
            "$FILE"

          # Set required NDK.
          if grep -q "ndkVersion" "$FILE"; then
            sed -i \
              's/ndkVersion = .*/ndkVersion = "28.2.13676358"/' \
              "$FILE"
          else
            sed -i \
              '/compileSdk = 37/a\
              ndkVersion = "28.2.13676358"' \
              "$FILE"
          fi

          echo ""
          echo "===== android/app/build.gradle.kts ====="
          cat "$FILE"

      - name: Create launcher icon
        shell: bash
        run: |
          set -e

          mkdir -p android/app/src/main/res/drawable

          cat > android/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#1976D2"
                  android:pathData="M0,0h108v108h-108z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,24
                  A30,30 0,1 0,54 84
                  A30,30 0,1 0,54 24" />

              <path
                  android:fillColor="#1976D2"
                  android:pathData="M54,34
                  A20,20 0,1 0,54 74
                  A20,20 0,1 0,54 34" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,43
                  A11,11 0,1 0,54 65
                  A11,11 0,1 0,54 43" />

          </vector>
          EOF

          sed -i \
            's#@mipmap/ic_launcher#@drawable/ic_launcher#' \
            android/app/src/main/AndroidManifest.xml

          echo "Launcher icon created."

          echo ""
          echo "Manifest icon:"
          grep -n "android:icon" \
            android/app/src/main/AndroidManifest.xml

      - name: Verify Android configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFY ANDROID CONFIGURATION"
          echo "========================================"

          echo ""
          echo "===== AGP ====="
          grep -R \
            "com.android.application" \
            android/settings.gradle.kts \
            android/build.gradle.kts \
            2>/dev/null || true

          echo ""
          echo "===== Kotlin ====="
          grep -R \
            "kotlin" \
            android/settings.gradle.kts \
            android/build.gradle.kts \
            2>/dev/null || true

          echo ""
          echo "===== compileSdk / NDK ====="
          grep -E \
            "compileSdk|ndkVersion" \
            android/app/build.gradle.kts

          echo ""
          echo "===== Android API 37 ====="
          test -d "$ANDROID_HOME/platforms/android-37"
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
          echo "Android API 37 is ready."

          echo ""
          echo "===== NDK 28.2 ====="
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          echo "NDK 28.2.13676358 is ready."

          echo ""
          echo "===== Launcher icon ====="
          test -f \
            android/app/src/main/res/drawable/ic_launcher.xml

          echo "Launcher icon is ready."

      - name: Generate Gradle Wrapper
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "Generating Gradle Wrapper using Gradle 8.14.1..."

          gradle wrapper \
            --gradle-version 8.14.1 \
            --distribution-type bin

          chmod +x gradlew

          echo ""
          echo "===== Wrapper files ====="
          ls -la
          ls -la gradle/wrapper

          echo ""
          echo "===== Gradle version ====="
          ./gradlew --version

      - name: Flutter Pub Get
        run: |
          set -e
          flutter pub get

      - name: Flutter Analyze
        run: |
          set -e
          flutter analyze

      - name: Build Release APK
        run: |
          set -e
          flutter build apk --release

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p build/release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/release/app-release.apk

          echo ""
          echo "========================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "========================================"

          ls -lh build/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: camera-share-apk
          path: build/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
