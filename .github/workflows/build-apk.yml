name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Setup Gradle 8.14.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.1"
          validate-wrappers: false

      # Create the Flutter local.properties file required by
      # android/settings.gradle.kts.
      - name: Create Flutter local.properties
        shell: bash
        run: |
          set -e

          mkdir -p android

          echo "Creating android/local.properties..."

          cat > android/local.properties <<EOF
          sdk.dir=${ANDROID_HOME}
          flutter.sdk=${FLUTTER_ROOT}
          EOF

          echo "local.properties created successfully:"
          cat android/local.properties

      # Generate the missing Gradle Wrapper.
      - name: Generate Gradle Wrapper
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "Generating Gradle Wrapper using Gradle 8.14.1..."

          gradle wrapper \
            --gradle-version 8.14.1 \
            --distribution-type bin

          chmod +x gradlew

          echo "Wrapper files:"
          ls -la
          ls -la gradle/wrapper

          echo "Checking Gradle Wrapper:"
          ./gradlew --version

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p build/release

          cp \
            build/app/outputs/flutter-apk/app-release.apk \
            build/release/app-release.apk

          echo "APK successfully created:"
          ls -lh build/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: camera-share-apk
          path: build/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
